name: Auto PR test(bot)

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  run_test:
    name: run test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{runner.os}}-nuget-bb-${{hashFiles('**/*.csproj', 'test/Directory.Build.props', 'global.json')}}
          restore-keys: |
            ${{runner.os}}-nuget-bb-

      - name: Restore dependencies
        run: dotnet restore src/BootstrapBlazor

      - name: Test
        run: |
          dotnet test --project test/UnitTest --results-directory TestResults --coverlet --coverlet-output-format cobertura

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: BB
          files: TestResults/**/coverage.cobertura*.xml
