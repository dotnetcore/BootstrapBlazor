name: Build project

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.x

    - name: Restore dependencies
      run: dotnet restore src/BootstrapBlazor

    - name: Build
      env:
        NUGET_API_KEY: ${{secrets.NUGET_API_KEY}}
        Bundle: True
      run: |
        dotnet build src/BootstrapBlazor

    - name: Test
      run: |
        dotnet test --project test/UnitTest --results-directory TestResults --coverlet --coverlet-output-format cobertura

    - name: Upload to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: TestResults

    - name: Check Router
      run: |
        dotnet test --project test/UnitTestDocs

    - name: Check Localizer
      run: |
        dotnet test --project test/UnitTest.Localization
